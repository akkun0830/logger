name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 追加：releaseブランチへのpush権限
    steps:
      - uses: actions/checkout@v5 # v5に更新

      - uses: actions/setup-node@v5 # v5に更新
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir /tmp/release
          cp -r dist/ /tmp/release/
          cp package.json /tmp/release/
          git checkout --orphan release
          git rm -rf .
          cp -r /tmp/release/dist ./dist
          cp /tmp/release/package.json ./package.json
          git add dist/ package.json
          git commit -m "release: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin release --force
